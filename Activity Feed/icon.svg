<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="row1accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="36" fill="url(#bg)"/>
  <rect width="256" height="256" rx="36" fill="url(#glow)"/>

  <!-- Left accent bar (mimics the notification border style) -->
  <rect x="22" y="48" width="4" height="160" rx="2" fill="#7c4dff" opacity="0.5"/>

  <!-- Row 1 — newest, highlighted -->
  <rect x="32" y="52" width="192" height="38" rx="9" fill="#1e1a3a"/>
  <rect x="32" y="52" width="192" height="38" rx="9" fill="url(#row1accent)"/>
  <!-- icon dot: green join -->
  <circle cx="54" cy="71" r="9" fill="#1b3a28"/>
  <circle cx="54" cy="71" r="5" fill="#4caf50"/>
  <!-- text lines -->
  <rect x="72" y="64" width="112" height="7" rx="3.5" fill="white" opacity="0.92"/>
  <rect x="72" y="76" width="68" height="5" rx="2.5" fill="white" opacity="0.38"/>
  <!-- live dot -->
  <circle cx="210" cy="71" r="4" fill="#4caf50"/>
  <circle cx="210" cy="71" r="7" fill="#4caf50" opacity="0.22"/>

  <!-- Row 2 -->
  <rect x="32" y="98" width="192" height="38" rx="9" fill="#13131f"/>
  <!-- icon dot: gold star -->
  <circle cx="54" cy="117" r="9" fill="#2e2410"/>
  <circle cx="54" cy="117" r="5" fill="#ffc107"/>
  <!-- text lines -->
  <rect x="72" y="110" width="130" height="7" rx="3.5" fill="white" opacity="0.78"/>
  <rect x="72" y="122" width="80" height="5" rx="2.5" fill="white" opacity="0.30"/>

  <!-- Row 3 -->
  <rect x="32" y="144" width="192" height="38" rx="9" fill="#111119"/>
  <!-- icon dot: blue coin -->
  <circle cx="54" cy="163" r="9" fill="#0d1e2e"/>
  <circle cx="54" cy="163" r="5" fill="#2196f3"/>
  <!-- text lines -->
  <rect x="72" y="156" width="96" height="7" rx="3.5" fill="white" opacity="0.60"/>
  <rect x="72" y="168" width="56" height="5" rx="2.5" fill="white" opacity="0.22"/>

  <!-- Row 4 — oldest, faded -->
  <rect x="32" y="190" width="192" height="32" rx="9" fill="#0e0e17" opacity="0.85"/>
  <!-- icon dot: purple -->
  <circle cx="54" cy="206" r="9" fill="#1a1225" opacity="0.9"/>
  <circle cx="54" cy="206" r="5" fill="#9c27b0" opacity="0.7"/>
  <!-- text lines -->
  <rect x="72" y="200" width="118" height="6" rx="3" fill="white" opacity="0.38"/>
  <rect x="72" y="211" width="70" height="4" rx="2" fill="white" opacity="0.16"/>
</svg>
